[project]
name = "genjax-template"
version = "0.2.0"
description = "Template repository for deep probabilistic programming in Jax with GenJAX"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # flax NNX backs the model/guide networks; flax 0.12 does not yet support
    # Python 3.14 (linen dataclass processing breaks on PEP 749), hence the
    # upper bound on requires-python above.
    "flax>=0.12.0",
    "genjax",
    "graphviz>=0.21",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "iprogress>=0.4",
    "ipywidgets>=8.1.7",
    # GenJAX's pjax internals require jax < 0.8 (they break on 0.9/0.10), so the
    # jax/jaxlib pins are reconciled down from the upstream template's >=0.9.
    "jax>=0.7.2,<0.8; platform_system == 'Darwin'",
    "jax[cuda12]>=0.7.2,<0.8; platform_system != 'Darwin'",
    "jaxlib>=0.7.2,<0.8",
    "jupyterlab>=4.4.5",
    "jupyterlab-tensorboard-pro>=4.0.0",
    "matplotlib>=3.10.6",
    "networkx>=3.0",
    "optax>=0.2.6",
    "pandas>=2.3.1,<3.0.0",
    "pytrie>=0.4.0",
    "rich>=14.1.0",
    "rootutils>=1.0.7",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.4",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
]

[tool.uv.sources]
genjax = { git = "https://github.com/Astera-org/genjax.git",
           branch = "develop" }
