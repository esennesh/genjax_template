defaults:
  - optim: adam
  - objective: elbo

_target_: src.learner.graphical.GraphicalModelLearner
# Trains like the SVI learner (ELBO via GenJAX's GFI + ADEV) but additionally
# captures the model's static graph structure at setup (nodes = sample sites,
# edges = value dependencies). See GraphicalModelLearner.
num_particles: 4
rng: 123
